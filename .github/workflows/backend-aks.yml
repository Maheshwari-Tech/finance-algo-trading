name: Backend to AKS

# Test and lint on every change. On main: build the backend image, push it to ACR and deploy it with Helm.
# All Azure names come from Terraform's outputs, so there is nothing to copy by hand.
# Prerequisite: the "Infrastructure (Terraform)" workflow has run at least once. Setup: docs/deploy-azure.md

on:
  push:
    branches: [main]
    paths: ["backend/**", "config/**", "examples/**", "Dockerfile.api", "deploy/helm/**", ".github/workflows/backend-aks.yml"]
  pull_request:
    paths: ["backend/**", "config/**", "examples/**", "Dockerfile.api", "deploy/helm/**", ".github/workflows/backend-aks.yml"]
  workflow_dispatch:

concurrency:
  group: backend-aks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          args="--set image.repository=example.azurecr.io/strategic-trader-api --set image.tag=ci \
                --set keyVault.name=kv --set keyVault.tenantId=t --set keyVault.workloadIdentityClientId=c \
                --set gateway.albId=/subscriptions/s/resourceGroups/r/providers/Microsoft.ServiceNetworking/trafficControllers/a \
                --set gateway.frontendName=frontend"
          helm lint deploy/helm/strategic-trader $args
          helm template ci deploy/helm/strategic-trader $args > /dev/null

  # Reads the names Terraform created (registry, cluster, vault, identities, gateway, address).
  infra:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    outputs:
      rg: ${{ steps.out.outputs.rg }}
      aks: ${{ steps.out.outputs.aks }}
      acr: ${{ steps.out.outputs.acr }}
      kv: ${{ steps.out.outputs.kv }}
      ns: ${{ steps.out.outputs.ns }}
      release: ${{ steps.out.outputs.release }}
      wi: ${{ steps.out.outputs.wi }}
      agc_id: ${{ steps.out.outputs.agc_id }}
      frontend: ${{ steps.out.outputs.frontend }}
      fqdn: ${{ steps.out.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform output
        id: out
        working-directory: deploy/terraform
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=strategic-trader.tfstate" \
            -backend-config="use_azuread_auth=true" > /dev/null
          out() { terraform output -raw "$1"; }
          {
            echo "rg=$(out resource_group)"
            echo "aks=$(out aks_name)"
            echo "acr=$(out acr_name)"
            echo "kv=$(out key_vault_name)"
            echo "ns=$(out namespace)"
            echo "release=$(out release_name)"
            echo "wi=$(out api_workload_identity_client_id)"
            echo "agc_id=$(out agc_id)"
            echo "frontend=$(out agc_frontend_name)"
            echo "fqdn=$(out api_fqdn)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ needs.infra.outputs.acr }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.tag }}
          tags: ${{ needs.infra.outputs.acr }}.azurecr.io/strategic-trader-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [infra, build]
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in GitHub > Settings > Environments for a manual approval gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.4
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ needs.infra.outputs.rg }}
          cluster-name: ${{ needs.infra.outputs.aks }}
          use-kubelogin: "true"
      - uses: azure/setup-helm@v4
      # --atomic rolls back automatically when the readiness checks fail. The pre-upgrade db-init Job runs first.
      - name: helm upgrade
        run: |
          helm upgrade --install "${{ needs.infra.outputs.release }}" deploy/helm/strategic-trader \
            --namespace "${{ needs.infra.outputs.ns }}" \
            --atomic --wait --timeout 10m \
            --set image.repository="${{ needs.infra.outputs.acr }}.azurecr.io/strategic-trader-api" \
            --set image.tag="${{ needs.build.outputs.tag }}" \
            --set keyVault.name="${{ needs.infra.outputs.kv }}" \
            --set keyVault.tenantId="${{ vars.AZURE_TENANT_ID }}" \
            --set keyVault.workloadIdentityClientId="${{ needs.infra.outputs.wi }}" \
            --set gateway.albId="${{ needs.infra.outputs.agc_id }}" \
            --set gateway.frontendName="${{ needs.infra.outputs.frontend }}" \
            --set gateway.hostname="${{ vars.API_HOSTNAME }}" \
            --set gateway.tls.enabled="${{ vars.TLS_CERT_NAME != '' }}" \
            --set keyVault.tlsCertName="${{ vars.TLS_CERT_NAME }}" \
            --set app.corsOrigins="${{ vars.CORS_ORIGINS }}"
      - name: Smoke test
        run: |
          host="${{ vars.API_HOSTNAME || needs.infra.outputs.fqdn }}"
          scheme=${{ vars.TLS_CERT_NAME != '' && 'https' || 'http' }}
          for i in $(seq 1 24); do
            curl -fsS "$scheme://$host/api/ready" && exit 0
            sleep 10
          done
          echo "API did not become ready at $scheme://$host" >&2
          exit 1
