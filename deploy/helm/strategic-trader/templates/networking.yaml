{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "st.fullname" . }}
  labels: {{ include "st.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.gateway.albId }}
    alb.networking.azure.io/alb-id: {{ .Values.gateway.albId | quote }}
    {{- else }}
    alb.networking.azure.io/alb-namespace: {{ .Values.gateway.albNamespace | quote }}
    alb.networking.azure.io/alb-name: {{ .Values.gateway.albName | quote }}
    {{- end }}
spec:
  gatewayClassName: azure-alb-external
  {{- if .Values.gateway.albId }}
  addresses:
    - type: alb.networking.azure.io/alb-frontend
      value: {{ required "gateway.frontendName is required with gateway.albId" .Values.gateway.frontendName | quote }}
  {{- end }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes: {namespaces: {from: Same}}
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      port: 443
      protocol: HTTPS
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ include "st.tlsSecretName" . }}}
      allowedRoutes: {namespaces: {from: Same}}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "st.fullname" . }}
  labels: {{ include "st.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "st.fullname" . }}
  {{- with .Values.gateway.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        {{- range .Values.gateway.pathPrefixes }}
        - path: {type: PathPrefix, value: {{ . | quote }}}
        {{- end }}
      backendRefs:
        - {name: {{ include "st.fullname" . }}, port: 80}
---
{{/* Without this the gateway probes "/", which the API-only service answers with 404, and marks every pod unhealthy. */}}
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "st.fullname" . }}
  labels: {{ include "st.labels" . | nindent 4 }}
spec:
  targetRef: {group: "", kind: Service, name: {{ include "st.fullname" . }}, namespace: {{ .Release.Namespace }}}
  default:
    interval: 5s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3
    http:
      path: /api/ready
      match: {statusCodes: [{start: 200, end: 200}]}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "st.fullname" . }}
  labels: {{ include "st.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "st.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: {cidr: {{ required "networkPolicy.albSubnetCidr is required" .Values.networkPolicy.albSubnetCidr | quote }}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}  # managed Prometheus scraper
      ports: [{port: 8123, protocol: TCP}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
{{- end }}
{{- if .Values.podMonitor.enabled }}
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "st.fullname" . }}
  labels: {{ include "st.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "st.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  podMetricsEndpoints:
    - {port: http, path: /metrics, interval: {{ .Values.podMonitor.interval }}}
{{- end }}
